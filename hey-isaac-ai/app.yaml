command: ['npm', 'run', 'start']
env:
  - name: NODE_ENV
    value: production

  # Lakebase (Postgres) — injected by platform from the postgres resource
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres

  # Persona token signing (HMAC secret, admin provisioned)
  - name: HI_GENIE_JWT_SIGNING_KEY
    valueFrom: jwt-signing-key
  - name: HI_GENIE_PERSONA_AUDIENCE
    value: mcp
  - name: HI_GENIE_PERSONA_ISSUER
    valueFrom: persona-issuer
  - name: HI_GENIE_APP_URL
    valueFrom: app-url

  # Dynamic Client Registration shared secret (admin provisioned)
  - name: HI_GENIE_DCR_SHARED_SECRET
    valueFrom: dcr-shared-secret

  # GitHub OAuth App — for external agent (Isaac) auth, Phase 5
  - name: HI_GENIE_GITHUB_CLIENT_ID
    valueFrom: github-client-id
  - name: HI_GENIE_GITHUB_CLIENT_SECRET
    valueFrom: github-client-secret

  # GitHub App — read/observe lane (webhooks + repo observation), Phase 5
  - name: HI_GENIE_GITHUB_APP_ID
    valueFrom: github-app-id
  - name: HI_GENIE_GITHUB_APP_PRIVATE_KEY
    valueFrom: github-app-private-key
  # Note: HI_GENIE_GITHUB_APP_INSTALLATION_ID removed — resolved per-repo dynamically
  - name: HI_GENIE_GITHUB_WEBHOOK_SECRET
    valueFrom: github-webhook-secret

  # Relay SP credentials — distributed to repos at register time (Phase 5c)
  - name: RELAY_SP_CLIENT_ID
    valueFrom: relay-sp-client-id
  - name: RELAY_SP_CLIENT_SECRET
    valueFrom: relay-sp-client-secret
  - name: APP_PUBLIC_URL
    valueFrom: app-public-url
