# Platform bootstrap job — run once after infra bundle deploy.
#
# Responsibilities:
#   1. Store workspace_url in the secret scope (auto-provisioned)
#   2. Validate admin-provisioned secrets are present (jwt_signing_key)
#   3. Run Lakebase Postgres steps (dev seed + wal2delta registration
#      reconciliation) when a Lakebase endpoint/host is provided. The database
#      credential is minted at runtime inside the notebook as the job's identity —
#      no secret/token is passed via parameters.
#
# Admin must provision jwt_signing_key before this job succeeds.
# Run via: ./deploy.sh --target dev --run-setup

resources:
  jobs:
    platform_bootstrap:
      name: "[${bundle.target}] hi-genie platform bootstrap"
      parameters:
        - name: secret_scope_name
          default: ${var.secret_scope_name}
        # Non-secret Lakebase connection metadata. deploy.sh overrides these at
        # run time via --params; the token is minted in-notebook, never passed here.
        - name: lakebase_endpoint
          default: "__unset__"
        - name: lakebase_host
          default: "__unset__"
        - name: target
          default: ${var.target}
      tasks:
        - task_key: bootstrap
          notebook_task:
            notebook_path: ../src/notebooks/platform_bootstrap.py
            base_parameters:
              secret_scope_name: "{{job.parameters.secret_scope_name}}"
              lakebase_endpoint: "{{job.parameters.lakebase_endpoint}}"
              lakebase_host: "{{job.parameters.lakebase_host}}"
              target: "{{job.parameters.target}}"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            environment_version: "${var.serverless_environment_version}"
      run_as:
        user_name: ${var.run_as_user}
