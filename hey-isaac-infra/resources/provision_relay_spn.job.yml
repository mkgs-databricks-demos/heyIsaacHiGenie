# Relay SP provisioning job — run once per environment after infra bundle deploy.
#
# Responsibilities:
#   1. Create the relay service principal (idempotent by displayName)
#   2. Store relay_sp_client_id in the secret scope (auto-provisioned)
#   3. Generate and store relay_sp_client_secret (auto-provisioned, rotation-safe)
#   4. Grant CAN_USE on the app for the relay SP
#
# Run via: ./deploy.sh --target dev --run-setup

resources:
  jobs:
    provision_relay_spn:
      name: "[${bundle.target}] hi-genie relay SP provisioning"
      parameters:
        - name: secret_scope_name
          default: ${var.secret_scope_name}
        - name: app_name
          default: ${var.app_name}
        - name: target
          default: ${var.target}
      tasks:
        - task_key: provision
          notebook_task:
            notebook_path: ../src/notebooks/provision_relay_spn.py
            base_parameters:
              secret_scope_name: ${var.secret_scope_name}
              app_name: ${var.app_name}
              target: ${var.target}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            environment_version: "${var.serverless_environment_version}"
      run_as:
        user_name: ${var.run_as_user}
